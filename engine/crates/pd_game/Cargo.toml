[package]
name = "pd_game"
edition.workspace = true
version.workspace = true

[features]
# Steam online play (App ID 480, net/steam.rs). On by default; the exe then
# needs `steam_api64.dll` next to it (build.rs copies it into target/<profile>/).
default = ["steam"]
steam = ["dep:steamworks", "dep:steamworks-sys"]

[dependencies]
bevy = { version = "0.19", features = ["wav"] }
glam = "0.32"
pd_formats = { path = "../pd_formats" }
serde_json = "1"
steamworks = { version = "0.13.1", optional = true }
steamworks-sys = { version = "0.13.0", optional = true }
