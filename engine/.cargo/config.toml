# Self-contained Windows toolchain: Rust GNU target + portable MinGW.
# MinGW lives outside the project because its linker breaks on paths with spaces.
[target.x86_64-pc-windows-gnu]
linker = "C:/Users/laure/.pdtools/mingw64/bin/gcc.exe"
rustflags = ["-C", "dlltool=C:/Users/laure/.pdtools/mingw64/bin/dlltool.exe"]
